name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .wrangler/models
          key: semantic-model-${{ runner.os }}-${{ hashFiles('config/semantic-categories.json') }}
      - name: Categorize catalog metadata with NLP
        run: npm run catalog:categorize
      - run: npm run category:evaluate -- --check
      - run: npm run category:semantic:evaluate -- --check
      - run: npm run catalog:validate
      - run: npm run access:validate
      - run: npm run discovery:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:functions
      - run: npm run test:guard
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
            coverage/
            reports/category-review.json
            reports/category-semantic-review.json
            reports/category-semantic-cache.json
            reports/category-semantic-evaluation.json
            reports/category-enrichment.json
            reports/category-triage.json
            reports/category-history.json
            reports/category-changes.json
            public/discovery.json
