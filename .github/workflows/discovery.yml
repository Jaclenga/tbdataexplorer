name: Refresh discovery metadata
on:
  schedule:
    - cron: "17 4 * * *"
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discovery-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh configured public metadata
        run: npm run discovery:refresh -- --max-items 40 --max-layers 150 --timeout-ms 900000
      - run: npm run category:evaluate -- --check
      - run: npm run discovery:validate
      - run: npm run catalog:validate && npm run access:validate
      - run: npm run typecheck && npm run lint && npm run test:coverage && npm run build && npm run build:functions && npm run test:guard
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Publish validated metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/discovery.json reports/category-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh government portal discovery metadata'
            git push origin HEAD:main
          else
            echo 'No catalog or daily verification changes; no commit needed.'
          fi
      - name: Verify automatic Pages catalog publication
        # Pages uses direct uploads. Its existing function reads this validated
        # GitHub artifact; metadata updates need no Cloudflare credentials/build.
        run: node scripts/verify-catalog-publication.mjs
      - name: Publish refreshed dataset pages and sitemap
        # Static SEO pages must track the same validated discovery snapshot.
        run: npx wrangler pages deploy dist --project-name=tbdataexplorer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report publisher health
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.wrangler/discovery-refresh.json','utf8')); if(r.refresh.outcome==='failed') {console.error('::error::All endpoint verification attempts failed; prior records retained.'); process.exitCode=1;} else if(r.refresh.outcome==='partial') console.log('::warning::Some endpoints failed or discovery limits were reached. Verified updates were published and previous records retained.');"
      - name: Discovery summary
        if: always()
        run: node scripts/discovery-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-report
          include-hidden-files: true
          path: |
            .wrangler/discovery-refresh.json
            .wrangler/category-review.json
            reports/category-review.json
            public/discovery.json
            test-results/
            playwright-report/
            coverage/
          retention-days: 14
